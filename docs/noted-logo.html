<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noted — Logo</title>
    <style>
      :root {
        --accent: #4b45c6;
        --accent-tint: #edecfb;
        --ink: #15161c;
        --muted: #71727d;
        --border: #e9eaee;
        --surface: #ffffff;
        --canvas: #f7f8fa;
        --radius: 12px;
        --radius-sm: 9px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--canvas);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        padding: 3rem 1.5rem;
      }

      .logo-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        max-width: 560px;
        margin: 0 auto;
      }
      .logo-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 2.5rem 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        width: 100%;
      }
      .dark-card {
        background: #15161c;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: var(--radius);
        padding: 2.5rem 3rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        width: 100%;
      }
      .variant-label {
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.04em;
        align-self: flex-start;
      }
      .logo-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .mark {
        border-radius: 14px;
        background: #4b45c6;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .wordmark {
        font-weight: 600;
        color: var(--ink);
        letter-spacing: -0.5px;
      }
      .wordmark span {
        color: var(--accent);
      }
      .wordmark-dark {
        font-weight: 600;
        color: #ffffff;
        letter-spacing: -0.5px;
      }
      .wordmark-dark span {
        color: #8b87e0;
      }
      .icon-row {
        display: flex;
        align-items: center;
        gap: 24px;
      }
    </style>
  </head>

                fill="white"

                fill="white"
